<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Narinukun Blue Parade Simulator with AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f0f4f8;
            overflow: hidden;
        }
        canvas {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F7FA 100%);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-radius: 8px;
        }
        .control-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
        .lyric-box {
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        .btn-active {
            background-color: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
        }
        .upload-btn {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 4px;
            background-color: #e2e8f0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .upload-btn:hover {
            background-color: #cbd5e1;
        }
        .status-dot {
            height: 8px;
            width: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }
        .status-red { background-color: #ef4444; }
        .status-yellow { background-color: #f59e0b; }
        .status-green { background-color: #22c55e; }
        
        /* AI Pulse Animation */
        @keyframes pulse-ai {
            0% { box-shadow: 0 0 0 0 rgba(98, 0, 234, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(98, 0, 234, 0); }
            100% { box-shadow: 0 0 0 0 rgba(98, 0, 234, 0); }
        }
        .ai-pulse {
            animation: pulse-ai 2s infinite;
        }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center relative">

    <!-- Header -->
    <div class="absolute top-4 left-4 z-10 bg-white/80 p-3 rounded-lg shadow-lg border-l-4 border-blue-800">
        <h1 class="text-xl font-bold text-blue-900">ผังขบวนคณะสีน้ำเงิน</h1>
        <p class="text-sm text-gray-600">กีฬาสี 126 ปี นารีนุกูลเกมส์</p>
    </div>

    <!-- Audio Manager (Top Right) -->
    <div class="absolute top-4 right-4 z-10 bg-white/90 p-3 rounded-lg shadow-lg w-64">
        <h3 class="text-xs font-bold text-gray-500 mb-2 uppercase tracking-wide">จัดการไฟล์เสียงจาก Drive</h3>
        <div class="flex flex-col gap-2">
            <div class="flex items-center justify-between">
                <span class="text-sm text-blue-900 flex items-center"><span id="dot1" class="status-dot status-yellow"></span> 1. เกียรติยศ</span>
                <label class="upload-btn">
                    อัปโหลด 1.wav
                    <input type="file" accept="audio/*" class="hidden" onchange="loadAudioFile(this, 1)">
                </label>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-sm text-blue-900 flex items-center"><span id="dot2" class="status-dot status-yellow"></span> 2. มหรรณพ</span>
                <label class="upload-btn">
                    อัปโหลด 2.wav
                    <input type="file" accept="audio/*" class="hidden" onchange="loadAudioFile(this, 2)">
                </label>
            </div>
            <div class="flex items-center justify-between">
                <span class="text-sm text-blue-900 flex items-center"><span id="dot3" class="status-dot status-yellow"></span> 3. วิจิตรพัสตรา</span>
                <label class="upload-btn">
                    อัปโหลด 3.wav
                    <input type="file" accept="audio/*" class="hidden" onchange="loadAudioFile(this, 3)">
                </label>
            </div>
        </div>
        <p id="audioHelpText" class="text-[10px] text-gray-500 mt-2 italic">กรุณาดาวน์โหลดจาก Drive แล้วอัปโหลดที่นี่</p>
    </div>

    <!-- Main Canvas -->
    <canvas id="paradeCanvas" width="800" height="600" class="w-full max-w-4xl h-auto aspect-[4/3]"></canvas>

    <!-- Lyrics Overlay -->
    <div id="lyricsDisplay" class="absolute bottom-32 w-full text-center px-4 pointer-events-none transition-opacity duration-500 opacity-0">
        <div class="inline-block bg-white/80 px-6 py-3 rounded-2xl shadow-xl backdrop-blur-md border border-blue-100">
            <p id="aiAnnouncerText" class="text-xs text-purple-600 font-bold mb-1 hidden italic">AI กำลังกล่าวเกริ่นนำ...</p>
            <p id="mainLyricText" class="text-lg md:text-2xl font-bold text-blue-900">
                รอเริ่มการแสดง...
            </p>
        </div>
    </div>

    <!-- AI Control Overlay -->
    <div class="absolute left-4 bottom-24 flex flex-col gap-2">
        <button id="aiAnnounceBtn" onclick="requestAIAnnounce()" class="ai-pulse bg-gradient-to-r from-purple-600 to-blue-600 text-white px-4 py-2 rounded-lg font-bold shadow-lg hover:from-purple-700 hover:to-blue-700 transition flex items-center gap-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
            โฆษก AI เกริ่นนำขบวน
        </button>
        <p id="aiStatusText" class="text-[10px] text-purple-800 font-bold bg-white/50 px-2 py-1 rounded hidden"></p>
    </div>

    <!-- Controls -->
    <div class="control-panel absolute bottom-0 w-full p-4 border-t border-gray-200 flex flex-col md:flex-row justify-between items-center gap-4 shadow-2xl z-20">
        
        <div class="flex gap-2 overflow-x-auto pb-2 md:pb-0 w-full md:w-auto justify-center">
            <button onclick="setPhase(1)" id="btn1" class="phase-btn px-4 py-2 rounded-full border-2 border-blue-800 text-blue-800 font-bold hover:bg-blue-100 transition whitespace-nowrap">
                1. เกียรติยศ (Opening)
            </button>
            <button onclick="setPhase(2)" id="btn2" class="phase-btn px-4 py-2 rounded-full border-2 border-blue-800 text-blue-800 font-bold hover:bg-blue-100 transition whitespace-nowrap">
                2. มหรรณพ (Students)
            </button>
            <button onclick="setPhase(3)" id="btn3" class="phase-btn px-4 py-2 rounded-full border-2 border-blue-800 text-blue-800 font-bold hover:bg-blue-100 transition whitespace-nowrap">
                3. วิจิตรพัสตรา (Teachers)
            </button>
        </div>

        <div class="flex gap-4 items-center">
            <button onclick="togglePlay()" id="playBtn" class="bg-blue-600 hover:bg-blue-700 text-white w-12 h-12 rounded-full flex items-center justify-center shadow-lg transform active:scale-95 transition">
                <svg id="iconPlay" class="w-6 h-6 fill-current ml-1" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="iconPause" class="w-6 h-6 fill-current hidden" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button onclick="resetSim()" class="text-gray-500 hover:text-red-500 transition" title="Reset">
                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            </button>
        </div>
    </div>

    <!-- Audio Elements (Hidden) -->
    <audio id="audio1" preload="auto"></audio>
    <audio id="audio2" preload="auto"></audio>
    <audio id="audio3" preload="auto"></audio>
    <audio id="audioAI" preload="auto"></audio>

    <script>
        const apiKey = ""; // Gemini API Key

        // --- Configuration ---
        const canvas = document.getElementById('paradeCanvas');
        const ctx = canvas.getContext('2d');
        let isPlaying = false;
        let isAIAnnouncing = false;
        let currentPhase = 0;
        let animationId;
        let globalSpeed = 0.8;
        let time = 0;
        let virtualTime = 0;

        const COLORS = {
            track: '#90A4AE',
            grass: '#A5D6A7',
            blueTeam: '#1E3A8A',
            skin: '#FFDCB1',
            gold: '#FFD700',
            teacherColors: ['#F43F5E', '#8B5CF6', '#10B981', '#F59E0B', '#3B82F6']
        };

        let marchers = [];
        let particles = [];

        // --- Gemini API Support ---
        async function callGemini(payload) {
            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) return await response.json();
                } catch (e) {
                    await new Promise(r => setTimeout(r, delay));
                    delay *= 2;
                }
            }
            throw new Error("Gemini API call failed after retries.");
        }

        async function requestAIAnnounce() {
            if (isAIAnnouncing || !currentPhase) return;
            const status = document.getElementById('aiStatusText');
            status.innerText = "✨ AI กำลังแต่งบทพูดเกริ่นนำ...";
            status.classList.remove('hidden');
            
            const phaseThemes = [
                "การเปิดงานอย่างยิ่งใหญ่ เกียรติยศ 126 ปี นารีนุกูล",
                "ความเพียรของพระมหาชนกและการก้าวไปข้างหน้าของนักเรียนสีน้ำเงิน",
                "ความงดงามหลากหลายของชุดไทยและวรรณคดีไทยผ่านคณะครู"
            ];

            try {
                // Generate Text
                const prompt = `ในฐานะโฆษกสนามงานกีฬาสีโรงเรียนนารีนุกูล ช่วยพูดเกริ่นนำสั้นๆ (ไม่เกิน 1 ประโยค) เพื่อเข้าสู่ขบวนช่วงที่ ${currentPhase} เรื่อง: ${phaseThemes[currentPhase-1]} โดยใช้คำพูดที่สุภาพและฮึกเหิม`;
                const result = await callGemini({ contents: [{ parts: [{ text: prompt }] }] });
                const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text || "ยินดีต้อนรับสู่ขบวนพาเหรดครับ";

                // Generate Voice
                status.innerText = "✨ AI กำลังแปลงเสียงโฆษก...";
                const ttsPayload = {
                    contents: [{ parts: [{ text: `Say in a professional Thai announcer voice: ${aiText}` }] }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Puck" } } }
                    }
                };
                
                const ttsResponse = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(ttsPayload)
                });
                
                const ttsData = await ttsResponse.json();
                const pcmData = ttsData.candidates[0].content.parts[0].inlineData.data;
                
                // Convert PCM to WAV for playback
                const blob = pcmToWav(pcmData, 24000);
                const url = URL.createObjectURL(blob);
                
                const audioAI = document.getElementById('audioAI');
                audioAI.src = url;
                
                // Play and Show
                isAIAnnouncing = true;
                document.getElementById('aiAnnouncerText').innerText = aiText;
                document.getElementById('aiAnnouncerText').classList.remove('hidden');
                document.getElementById('lyricsDisplay').style.opacity = '1';
                
                audioAI.play();
                audioAI.onended = () => {
                    isAIAnnouncing = false;
                    document.getElementById('aiAnnouncerText').classList.add('hidden');
                    status.classList.add('hidden');
                    // Automatically start simulation after AI intro
                    if (!isPlaying) togglePlay();
                };

            } catch (err) {
                console.error(err);
                status.innerText = "⚠️ AI ขัดข้องชั่วคราว";
                setTimeout(() => status.classList.add('hidden'), 2000);
            }
        }

        function pcmToWav(base64Pcm, sampleRate) {
            const pcmBuffer = Uint8Array.from(atob(base64Pcm), c => c.charCodeAt(0));
            const header = new ArrayBuffer(44);
            const view = new DataView(header);
            const writeString = (o, s) => { for (let i = 0; i < s.length; i++) view.setUint8(o + i, s.charCodeAt(i)); };
            writeString(0, 'RIFF'); view.setUint32(4, 36 + pcmBuffer.length, true); writeString(8, 'WAVE');
            writeString(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true);
            view.setUint16(34, 16, true); writeString(36, 'data'); view.setUint32(40, pcmBuffer.length, true);
            const wavBuffer = new Uint8Array(header.byteLength + pcmBuffer.length);
            wavBuffer.set(new Uint8Array(header), 0); wavBuffer.set(pcmBuffer, 44);
            return new Blob([wavBuffer], { type: 'audio/wav' });
        }

        // --- Parade Core Logic ---
        class Marcher {
            constructor(x, y, type, label = "") {
                this.x = x; this.y = y; this.type = type; this.label = label;
                this.offset = Math.random() * 10;
                this.color = (type === 'teacher') ? COLORS.teacherColors[Math.floor(Math.random() * COLORS.teacherColors.length)] : COLORS.blueTeam;
            }
            update() { if (isPlaying) this.y -= globalSpeed; }
            draw() {
                ctx.save(); ctx.translate(this.x, this.y);
                const bob = Math.sin(time * 0.1 + this.offset) * 2;
                ctx.fillStyle = 'rgba(0,0,0,0.1)'; ctx.beginPath(); ctx.ellipse(0, 0, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
                ctx.translate(0, bob);
                if (this.type === 'drum_major') {
                    ctx.fillStyle = 'white'; ctx.fillRect(-5, -20, 10, 20); ctx.fillStyle = COLORS.blueTeam; ctx.fillRect(-6, -35, 12, 15);
                    ctx.fillStyle = 'black'; ctx.fillRect(-5, -50, 10, 12);
                } else if (this.type === 'sign') {
                    ctx.fillStyle = COLORS.blueTeam; ctx.fillRect(-5, -30, 10, 15); ctx.fillStyle = COLORS.skin; ctx.beginPath(); ctx.arc(0, -34, 4, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = 'white'; ctx.strokeStyle = '#333'; ctx.fillRect(-25, -55, 50, 20); ctx.strokeRect(-25, -55, 50, 20);
                    ctx.fillStyle = 'black'; ctx.font = '8px Sarabun'; ctx.textAlign = 'center'; ctx.fillText(this.label, 0, -42);
                } else if (this.type === 'teacher') {
                    ctx.fillStyle = this.color; ctx.beginPath(); ctx.moveTo(-6, -20); ctx.lineTo(6, -20); ctx.lineTo(8, 0); ctx.lineTo(-8, 0); ctx.fill();
                    ctx.fillStyle = COLORS.skin; ctx.beginPath(); ctx.arc(0, -36, 5, 0, Math.PI*2); ctx.fill();
                    ctx.fillStyle = COLORS.gold; ctx.beginPath(); ctx.moveTo(-2, -40); ctx.lineTo(2, -40); ctx.lineTo(0, -48); ctx.fill();
                } else {
                    ctx.fillStyle = COLORS.blueTeam; ctx.fillRect(-4, -25, 8, 25); ctx.fillStyle = COLORS.skin; ctx.beginPath(); ctx.arc(0, -29, 4, 0, Math.PI*2); ctx.fill();
                }
                ctx.restore();
            }
        }

        class Particle {
            constructor() { this.x = Math.random() * canvas.width; this.y = Math.random() * canvas.height; this.size = Math.random() * 2; this.speed = Math.random() * 0.5 + 0.2; }
            update() { this.y += this.speed; if (this.y > canvas.height) this.y = 0; }
            draw() { ctx.fillStyle = 'white'; ctx.globalAlpha = 0.4; ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1; }
        }

        function setupFormation() {
            marchers.push(new Marcher(400, 450, 'drum_major'));
            marchers.push(new Marcher(360, 470, 'drum_major'));
            marchers.push(new Marcher(440, 470, 'drum_major'));
            marchers.push(new Marcher(370, 550, 'sign', 'นารีนุกูล'));
            marchers.push(new Marcher(430, 550, 'sign', '126 ปี'));
            marchers.push(new Marcher(400, 600, 'sign', 'คณะสีน้ำเงิน'));
            const sY = 800;
            for(let r=0; r<4; r++) for(let c=0; c<4; c++) marchers.push(new Marcher(400 + (c - 1.5) * 40, sY + r * 45, 'teacher'));
            const stY = 1100;
            for(let r=0; r<8; r++) for(let c=0; c<5; c++) marchers.push(new Marcher(400 + (c - 2) * 40, stY + r * 40, 'student'));
        }

        function init() {
            for(let i=0; i<30; i++) particles.push(new Particle());
            setupFormation();
            setPhase(1);
            animate();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (isPlaying) { time++; virtualTime += 1/60; }
            ctx.fillStyle = COLORS.track; ctx.fillRect(200, 0, 400, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            marchers.sort((a,b)=>a.y-b.y);
            marchers.forEach(m => { m.update(); m.draw(); });
            updateLyrics();
            requestAnimationFrame(animate);
        }

        const lyrics = [
            [{t:0,txt:"กึกก้องหล้า... นภาลัย... ไกวัลก้อง"},{t:6,txt:"แซ่ซ้องป้อง... สดุดี... ศรีสถาน"},{t:12,txt:"๑๒๖ ปี... นารีนุกูลเกมส์... เกษมสำราญ"},{t:18,txt:"สุขสราญ... กีฬาเสก... สีสัน... พลันรุ่งเรือง"}],
            [{t:0,txt:"สีน้ำเงิน... เพริศแพร้ว... แววเวหา"},{t:5,txt:"ดั่งคงคา... มหรรณพ... จบสมัย"},{t:10,txt:"แม้คลื่นลม... ถาโถม... โหมแรงไฟ"},{t:15,txt:"ยังก้าวไป... มุ่งมั่น... ไม่สั่นคลอน"}],
            [{t:0,txt:"ยลโฉมครู... ชูช่อ... ก่อศิลป์ศาสตร์"},{t:6,txt:"งามวิลาส... วิจิตร... พัสตรา... สง่าศรี"},{t:12,txt:"หลากสีสัน... พรรณราย... สายวารี"},{t:18,txt:"ดั่งมาลี... นานาพรรณ... อันอำไพ"}]
        ];

        function updateLyrics() {
            const audio = document.getElementById('audio' + currentPhase);
            const t = (audio && audio.src && !audio.paused) ? audio.currentTime : virtualTime;
            const currentLyrics = lyrics[currentPhase-1];
            let display = "";
            for(let l of currentLyrics) if(t >= l.t) display = l.txt;
            if(display && !isAIAnnouncing) document.getElementById('mainLyricText').innerText = display;
        }

        function setPhase(p) {
            isPlaying = false; virtualTime = 0; currentPhase = p;
            [1,2,3].forEach(i => { let a=document.getElementById('audio'+i); a.pause(); a.currentTime=0; });
            document.querySelectorAll('.phase-btn').forEach((b,i)=> b.classList.toggle('btn-active', i+1===p));
            marchers = []; setupFormation();
            if(p===2) marchers.forEach(m=>m.y-=400); if(p===3) marchers.forEach(m=>m.y-=600);
            document.getElementById('lyricsDisplay').style.opacity = '1';
            document.getElementById('mainLyricText').innerText = "พร้อมสำหรับช่วงที่ " + p;
            updatePlayIcon();
        }

        async function togglePlay() {
            const a = document.getElementById('audio' + currentPhase);
            if (!isPlaying) {
                isPlaying = true;
                if(a.src && a.src !== window.location.href) try { await a.play(); } catch(e){}
            } else { isPlaying = false; a.pause(); }
            updatePlayIcon();
        }

        function updatePlayIcon() {
            document.getElementById('iconPlay').classList.toggle('hidden', isPlaying);
            document.getElementById('iconPause').classList.toggle('hidden', !isPlaying);
        }

        function loadAudioFile(input, idx) {
            const f = input.files[0];
            if(f) {
                document.getElementById('audio'+idx).src = URL.createObjectURL(f);
                document.getElementById('dot'+idx).className = 'status-dot status-green';
            }
        }

        function resetSim() { setPhase(1); }
        window.onload = init;
    </script>
</body>
</html>
