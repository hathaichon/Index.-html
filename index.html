<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Narinukun Games 2026: Smart Evaluation</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    body { font-family: 'Sarabun', sans-serif; background-color: #f0f4f8; -webkit-tap-highlight-color: transparent; }
    .gradient-bg { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    // Online DB endpoint (Google Apps Script Web App)
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycby5As2FBzvbmAAIV8xIC4Kxd6_pqTvKCCbd_-p5SY9Di9_e8uBULh_xRjEi6TJ0Ta4AsQ/exec";
    const ADMIN_PASSWORD = "2026";

    // Active team only (ตามคำขอ: Active สีน้ำเงินสีเดียว)
    const ACTIVE_TEAM = {
      id: 'blue',
      name: 'สีน้ำเงิน (พระญาณ)',
      color: 'bg-blue-600',
      text: 'text-blue-600',
      score: 1250,
    };

    const TEAMS = [ACTIVE_TEAM];

    const ROLES = [
      'นักกีฬา (Athlete)',
      'กองเชียร์/ผู้นำเชียร์ (Cheerleader)',
      'คณะกรรมการ/สตาฟฟ์ (Staff)',
      'ครูและบุคลากร (Teacher)'
    ];

    const QUESTIONS = [
      { id: 1, category: 'Result', title: 'ทักษะและความสำเร็จ', desc: 'ทักษะกีฬา/การทำงานพัฒนาขึ้นชัดเจนหรือไม่?' },
      { id: 2, category: 'Result', title: 'ความคิดสร้างสรรค์', desc: 'ความคิดสร้างสรรค์ในขบวน/เชียร์ น่าประทับใจ?' },
      { id: 3, category: 'Result', title: 'ความสามัคคี', desc: 'กิจกรรมสำเร็จตามวัตถุประสงค์ความสามัคคี?' },
      { id: 4, category: 'Process', title: 'การทำงานเป็นทีม', desc: 'การวางแผนและการแก้ปัญหาร่วมกันมีประสิทธิภาพ?' },
      { id: 5, category: 'Process', title: 'การตัดสินใจ', desc: 'ตัดสินใจในสถานการณ์จริงได้ดีเพียงใด?' },
      { id: 6, category: 'Reflection', title: 'การตระหนักรู้', desc: 'มองเห็นจุดแข็งและจุดที่ต้องปรับปรุงของตนเอง?' },
      { id: 7, category: 'Reflection', title: 'การเรียนรู้จากการทำ', desc: 'ได้รับบทเรียนใหม่ๆ จากการลงมือทำจริง?' },
      { id: 8, category: 'Growth', title: 'การรับมืออุปสรรค', desc: 'จัดการปัญหาหน้างานมีความเป็นมืออาชีพ?' },
      { id: 9, category: 'Growth', title: 'ความรับผิดชอบ', desc: 'มีความรับผิดชอบและน้ำใจนักกีฬาเพิ่มขึ้น?' },
      { id: 10, category: 'Growth', title: 'วิสัยทัศน์', desc: 'เห็นสิ่งที่ต้องปรับปรุงในการจัดครั้งต่อไป?' }
    ];

    const DEFAULT_FEED = [
      { user: 'Admin', text: 'ระบบออนไลน์พร้อมใช้งานแล้วสำหรับทีมสีน้ำเงิน', time: 'Now', color: 'bg-blue-100 text-blue-800' },
      { user: 'BlueCaptain', text: 'สีน้ำเงินพร้อมลุย! 💙', time: '3m ago', color: 'bg-sky-100 text-sky-800' },
    ];

    async function fetchSummaryFromDB() {
      const url = `${GOOGLE_SCRIPT_URL}?action=summary&team=${encodeURIComponent(ACTIVE_TEAM.id)}`;
      const response = await fetch(url, { method: 'GET' });
      if (!response.ok) throw new Error(`summary failed: ${response.status}`);
      return response.json();
    }

    async function saveEvaluationToDB(payload) {
      const response = await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'submit', ...payload }),
      });
      if (!response.ok) {
        throw new Error(`submit failed: ${response.status}`);
      }
      return response.json().catch(() => ({ ok: true }));
    }

    function App() {
      const [name, setName] = useState('');
      const [role, setRole] = useState('');
      const [team, setTeam] = useState(ACTIVE_TEAM.name);
      const [ratings, setRatings] = useState(Object.fromEntries(QUESTIONS.map(q => [q.id, 3])));
      const [comment, setComment] = useState('');
      const [submitted, setSubmitted] = useState(false);
      const [loading, setLoading] = useState(false);
      const [showDashboard, setShowDashboard] = useState(false);
      const [passInput, setPassInput] = useState('');
      const [authorized, setAuthorized] = useState(false);
      const [dbStatus, setDbStatus] = useState('กำลังเชื่อมต่อฐานข้อมูล...');
      const [summary, setSummary] = useState({ totalResponses: 0, latestAverage: '0.00', topTeam: ACTIVE_TEAM.name, teamScore: ACTIVE_TEAM.score });
      const [socialFeed, setSocialFeed] = useState(DEFAULT_FEED);

      const teamRank = useMemo(() => [{ ...ACTIVE_TEAM, score: summary.teamScore || ACTIVE_TEAM.score }], [summary.teamScore]);
      const avg = useMemo(() => (Object.values(ratings).reduce((a, b) => a + b, 0) / QUESTIONS.length).toFixed(2), [ratings]);

      useEffect(() => {
        const loadSummary = async () => {
          try {
            const data = await fetchSummaryFromDB();
            setSummary({
              totalResponses: Number(data.totalResponses || 0),
              latestAverage: Number(data.latestAverage || 0).toFixed(2),
              topTeam: data.topTeam || ACTIVE_TEAM.name,
              teamScore: Number(data.teamScore || ACTIVE_TEAM.score),
            });
            if (Array.isArray(data.feed) && data.feed.length > 0) {
              setSocialFeed(data.feed);
            }
            setDbStatus('เชื่อมต่อฐานข้อมูลออนไลน์สำเร็จ');
          } catch (error) {
            console.error(error);
            setDbStatus('เชื่อมต่อฐานข้อมูลไม่ได้ กำลังใช้ข้อมูลสำรองชั่วคราว');
          }
        };
        loadSummary();
      }, []);

      const submitEvaluation = async () => {
        if (!name || !role) return alert('กรุณากรอกข้อมูลให้ครบถ้วน');

        setLoading(true);
        const payload = {
          name,
          role,
          team: ACTIVE_TEAM.id,
          ratings,
          comment,
          average: avg,
          timestamp: new Date().toISOString(),
          host: window.location.host,
          online: true,
        };

        try {
          await saveEvaluationToDB(payload);
          setSummary((prev) => ({
            ...prev,
            totalResponses: prev.totalResponses + 1,
            latestAverage: avg,
          }));
          setSubmitted(true);
        } catch (error) {
          console.error(error);
          alert('ส่งข้อมูลไม่สำเร็จ โปรดลองอีกครั้ง');
        } finally {
          setLoading(false);
        }
      };

      const openDashboard = () => {
        if (passInput === ADMIN_PASSWORD) setAuthorized(true);
        else alert('รหัสผ่านไม่ถูกต้อง');
      };

      if (submitted) {
        return <div className="min-h-screen flex items-center justify-center p-6">
          <div className="bg-white rounded-2xl shadow-xl p-8 text-center max-w-md w-full">
            <i className="ph ph-check-circle text-6xl text-green-500"></i>
            <h1 className="text-2xl font-bold mt-3">ส่งแบบประเมินเรียบร้อย</h1>
            <p className="text-slate-600 mt-2">ขอบคุณสำหรับความคิดเห็นของทีม <b>{ACTIVE_TEAM.name}</b><br/>คะแนนเฉลี่ยของคุณคือ <b>{avg}</b></p>
          </div>
        </div>;
      }

      return <div className="min-h-screen pb-10">
        <header className="gradient-bg text-white p-6 rounded-b-3xl shadow-lg mb-6">
          <div className="max-w-5xl mx-auto flex justify-between items-center gap-4">
            <div>
              <h1 className="text-2xl md:text-3xl font-extrabold">Narinukun Games 2026</h1>
              <p className="opacity-90">Smart Evaluation Platform (Blue Team Active)</p>
              <p className="text-xs mt-1 opacity-90">{dbStatus}</p>
            </div>
            <button onClick={() => setShowDashboard(!showDashboard)} className="bg-white/15 px-4 py-2 rounded-xl border border-white/30">Dashboard</button>
          </div>
        </header>

        <main className="max-w-5xl mx-auto px-4 grid md:grid-cols-3 gap-6">
          <section className="md:col-span-2 bg-white rounded-2xl p-5 shadow">
            <h2 className="font-bold text-xl mb-4">แบบประเมินกิจกรรม (เปิดเฉพาะสีน้ำเงิน)</h2>
            <div className="grid md:grid-cols-2 gap-3">
              <input className="border rounded-xl p-3" placeholder="ชื่อ-นามสกุล" value={name} onChange={e => setName(e.target.value)} />
              <select className="border rounded-xl p-3" value={role} onChange={e => setRole(e.target.value)}>
                <option value="">เลือกบทบาท</option>
                {ROLES.map(r => <option key={r} value={r}>{r}</option>)}
              </select>
              <input className="border rounded-xl p-3 md:col-span-2 bg-slate-100" value={team} readOnly />
            </div>

            <div className="space-y-4 mt-5">
              {QUESTIONS.map(q => <div key={q.id} className="border rounded-xl p-4">
                <div className="font-semibold">{q.id}. {q.title}</div>
                <div className="text-sm text-slate-600 mb-2">{q.desc}</div>
                <input type="range" min="1" max="5" value={ratings[q.id]} onChange={e => setRatings({ ...ratings, [q.id]: Number(e.target.value) })} className="w-full" />
                <div className="text-right text-sm text-slate-500">คะแนน: {ratings[q.id]}/5</div>
              </div>)}
            </div>

            <textarea className="border rounded-xl p-3 w-full mt-4" rows="3" placeholder="ข้อเสนอแนะเพิ่มเติม" value={comment} onChange={e => setComment(e.target.value)} />
            <button onClick={submitEvaluation} disabled={loading} className="mt-4 w-full bg-blue-600 text-white rounded-xl py-3 font-bold disabled:opacity-60">
              {loading ? 'กำลังส่ง...' : `ส่งแบบประเมิน (เฉลี่ย ${avg})`}
            </button>
          </section>

          <aside className="space-y-6">
            <div className="bg-white rounded-2xl p-5 shadow">
              <h3 className="font-bold mb-3">สถานะทีมที่ Active</h3>
              <div className="space-y-2">
                {teamRank.map((t, i) => <div key={t.id} className="flex justify-between items-center text-sm"><span className={t.text}>{i + 1}. {t.name}</span><b>{t.score}</b></div>)}
              </div>
            </div>
            <div className="bg-white rounded-2xl p-5 shadow">
              <h3 className="font-bold mb-3">Live Feed</h3>
              <div className="space-y-2">{socialFeed.map((p, idx) => <div key={idx} className={`rounded-lg p-2 text-sm ${p.color || 'bg-slate-100 text-slate-700'}`}><b>{p.user}</b>: {p.text}</div>)}</div>
            </div>
          </aside>
        </main>

        {showDashboard && <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl p-6 max-w-md w-full">
            {!authorized ? <>
              <h3 className="font-bold text-lg">เข้าสู่ Dashboard</h3>
              <input type="password" className="border rounded-xl p-3 w-full mt-3" value={passInput} onChange={e => setPassInput(e.target.value)} placeholder="รหัสผ่านผู้ดูแล" />
              <button className="mt-3 bg-slate-900 text-white rounded-xl px-4 py-2 w-full" onClick={openDashboard}>ยืนยัน</button>
            </> : <>
              <h3 className="font-bold text-lg mb-3">Dashboard สรุป</h3>
              <p>สถานะฐานข้อมูล: <b>{dbStatus}</b></p>
              <p>จำนวนผู้ประเมินทั้งหมด: <b>{summary.totalResponses}</b></p>
              <p>คะแนนเฉลี่ยล่าสุด: <b>{summary.latestAverage}</b></p>
              <p>ทีมที่ Active: <b>{summary.topTeam}</b></p>
            </>}
            <button className="mt-4 text-slate-500 text-sm" onClick={() => setShowDashboard(false)}>ปิด</button>
          </div>
        </div>}
      </div>;
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
